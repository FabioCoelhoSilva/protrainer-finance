<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProTrainer Finance App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN para transpolar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ProTrainerFinanceApp() {
      // --- ESTADOS E PERSISTÊNCIA (localStorage) ---
      const [hideValues, setHideValues] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'agenda', 'alunos', 'lembretes'

      // Perfil e Teste Grátis
      const [userProfile, setUserProfile] = useState(() => {
        const saved = localStorage.getItem('pt_profile');
        return saved ? JSON.parse(saved) : {
          nome: 'Personal Trainer',
          cref: '000000-G/UF',
          whatsapp: '',
          foto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80',
          dataInicioTeste: new Date().toISOString()
        };
      });

      // Base de Dados: Alunos
      const [alunos, setAlunos] = useState(() => {
        const saved = localStorage.getItem('pt_alunos');
        return saved ? JSON.parse(saved) : [];
      });

      // Base de Dados: Agenda
      const [aulas, setAulas] = useState(() => {
        const saved = localStorage.getItem('pt_aulas');
        return saved ? JSON.parse(saved) : [];
      });

      // Base de Dados: Lembretes
      const [lembretes, setLembretes] = useState(() => {
        const saved = localStorage.getItem('pt_lembretes');
        return saved ? JSON.parse(saved) : [];
      });

      // Guardar alterações no localStorage
      useEffect(() => {
        localStorage.setItem('pt_profile', JSON.stringify(userProfile));
      }, [userProfile]);

      useEffect(() => {
        localStorage.setItem('pt_alunos', JSON.stringify(alunos));
      }, [alunos]);

      useEffect(() => {
        localStorage.setItem('pt_aulas', JSON.stringify(aulas));
      }, [aulas]);

      useEffect(() => {
        localStorage.setItem('pt_lembretes', JSON.stringify(lembretes));
      }, [lembretes]);

      // Modais
      const [showModalLembrete, setShowModalLembrete] = useState(false);
      const [novoLembrete, setNovoLembrete] = useState({ titulo: '', texto: '', prioridade: 'Amarelo', alunoId: '' });

      const [showModalAluno, setShowModalAluno] = useState(false);
      const [novoAluno, setNovoAluno] = useState({
        nome: '', tipo: 'Aluno de Personal Trainer (Presencial)', plano: 'Mensal', valor: '', saldoCreditos: 0
      });

      const [showModalAula, setShowModalAula] = useState(false);
      const [novaAula, setNovaAula] = useState({ dia: 'Segunda', hora: '08:00', alunoId: '', modalidade: 'Presencial' });

      // Funções Lembretes
      const handleAdicionarLembrete = (e) => {
        e.preventDefault();
        if (!novoLembrete.titulo) return;
        const item = {
          id: Date.now(),
          titulo: novoLembrete.titulo,
          texto: novoLembrete.texto,
          prioridade: novoLembrete.prioridade,
          data: new Date().toISOString().split('T')[0],
          concluido: false,
          alunoId: novoLembrete.alunoId ? Number(novoLembrete.alunoId) : null
        };
        setLembretes([item, ...lembretes]);
        setShowModalLembrete(false);
        setNovoLembrete({ titulo: '', texto: '', prioridade: 'Amarelo', alunoId: '' });
      };

      const toggleLembrete = (id) => {
        setLembretes(lembretes.map(l => l.id === id ? { ...l, concluido: !l.concluido } : l));
      };

      const deletarLembrete = (id) => {
        setLembretes(lembretes.filter(l => l.id !== id));
      };

      // Funções Alunos
      const handleAdicionarAluno = (e) => {
        e.preventDefault();
        if (!novoAluno.nome || !novoAluno.valor) return;
        const item = {
          id: Date.now(),
          nome: novoAluno.nome,
          tipo: novoAluno.tipo,
          plano: novoAluno.plano,
          valor: Number(novoAluno.valor),
          inicio: new Date().toISOString().split('T')[0],
          status: 'Ativo',
          saldoCreditos: Number(novoAluno.saldoCreditos) || 0
        };
        setAlunos([...alunos, item]);
        setShowModalAluno(false);
        setNovoAluno({ nome: '', tipo: 'Aluno de Personal Trainer (Presencial)', plano: 'Mensal', valor: '', saldoCreditos: 0 });
      };

      const deletarAluno = (id) => {
        setAlunos(alunos.filter(a => a.id !== id));
      };

      // Funções Agenda
      const handleAdicionarAula = (e) => {
        e.preventDefault();
        if (!novaAula.alunoId) return;
        const alunoObj = alunos.find(a => a.id === Number(novaAula.alunoId));
        const item = {
          id: Date.now(),
          dia: novaAula.dia,
          hora: novaAula.hora,
          alunoId: Number(novaAula.alunoId),
          alunoNome: alunoObj ? alunoObj.nome : 'Aluno',
          modalidade: novaAula.modalidade,
          status: 'Agendada'
        };
        setAulas([...aulas, item]);
        setShowModalAula(false);
      };

      const deletarAula = (id) => {
        setAulas(aulas.filter(a => a.id !== id));
      };

      // Cálculos Financeiros
      const totalRecebido = alunos.reduce((acc, a) => acc + (a.status === 'Ativo' ? Number(a.valor) : 0), 0);

      // Cálculo de Teste de 14 dias
      const dataInicio = new Date(userProfile.dataInicioTeste);
      const hoje = new Date();
      const diasPassados = Math.floor((hoje - dataInicio) / (1000 * 60 * 60 * 24));
      const diasRestantes = Math.max(0, 14 - diasPassados);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans pb-24">
          
          {/* CABEÇALHO FIXO */}
          <header className="sticky top-0 z-40 bg-slate-800/90 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img src={userProfile.foto} alt="Perfil" className="w-10 h-10 rounded-full border-2 border-emerald-500 object-cover" />
              <div>
                <h1 className="text-sm font-bold text-slate-100 leading-tight">ProTrainer Finance</h1>
                <p className="text-xs text-emerald-400 font-medium">Gestão FIT Inteligente</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <span className={`text-[10px] uppercase tracking-wider px-2 py-1 rounded-full font-bold ${diasRestantes > 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-red-500/20 text-red-300'}`}>
                {diasRestantes > 0 ? `Teste: ${diasRestantes} dias` : 'Expirado'}
              </span>
              <button onClick={() => setHideValues(!hideValues)} className="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300 transition">
                {hideValues ? '🙈' : '👁️'}
              </button>
            </div>
          </header>

          {/* DASHBOARD */}
          {activeTab === 'dashboard' && (
            <main className="p-4 space-y-6 max-w-lg mx-auto">
              <section className="grid grid-cols-2 gap-3">
                <div className="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                  <span className="text-xs text-slate-400 block font-medium">Faturação Total</span>
                  <span className="text-xl font-extrabold text-emerald-400">
                    {hideValues ? '••••••' : `R$ ${totalRecebido.toFixed(2)}`}
                  </span>
                </div>
                <div className="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                  <span className="text-xs text-slate-400 block font-medium">Alunos Ativos</span>
                  <span className="text-xl font-extrabold text-amber-400">
                    {alunos.filter(a => a.status === 'Ativo').length}
                  </span>
                </div>
              </section>

              {/* CENTRAL DE LEMBRETES */}
              <section className="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50 space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-bold text-slate-200">Central de Lembretes</h2>
                  <button 
                    onClick={() => setShowModalLembrete(true)}
                    className="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition"
                  >
                    + Criar
                  </button>
                </div>

                <div className="space-y-2">
                  {lembretes.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-4">Nenhum lembrete registado.</p>
                  ) : (
                    lembretes.map((item) => {
                      const corBorda = item.prioridade === 'Vermelho' ? 'border-red-500' : item.prioridade === 'Amarelo' ? 'border-amber-500' : 'border-blue-500';
                      return (
                        <div key={item.id} className={`p-3 rounded-xl bg-slate-900/60 border-l-4 ${corBorda} border-y border-r border-slate-700/40 flex items-start justify-between gap-2`}>
                          <div className="flex items-start gap-2.5">
                            <button onClick={() => toggleLembrete(item.id)} className={`mt-0.5 w-4 h-4 rounded border flex items-center justify-center ${item.concluido ? 'bg-emerald-500 border-emerald-500 text-slate-950 text-xs font-bold' : 'border-slate-500'}`}>
                              {item.concluido && '✓'}
                            </button>
                            <div>
                              <h4 className={`text-xs font-bold ${item.concluido ? 'line-through text-slate-500' : 'text-slate-200'}`}>{item.titulo}</h4>
                              <p className={`text-xs mt-0.5 ${item.concluido ? 'line-through text-slate-600' : 'text-slate-400'}`}>{item.texto}</p>
                            </div>
                          </div>
                          <button onClick={() => deletarLembrete(item.id)} className="text-slate-500 hover:text-red-400 text-xs px-1">✕</button>
                        </div>
                      );
                    })
                  )}
                </div>
              </section>
            </main>
          )}

          {/* AGENDA DA SEMANA */}
          {activeTab === 'agenda' && (
            <main className="p-4 space-y-4 max-w-lg mx-auto">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-bold text-slate-100">Agenda Semanal</h2>
                <button onClick={() => setShowModalAula(true)} className="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition">
                  + Nova Aula
                </button>
              </div>

              {aulas.length === 0 ? (
                <p className="text-xs text-slate-500 text-center py-8">Nenhuma aula agendada.</p>
              ) : (
                <div className="space-y-2">
                  {aulas.map((aula) => (
                    <div key={aula.id} className="p-3 bg-slate-800/60 rounded-xl border border-slate-700/50 flex items-center justify-between">
                      <div>
                        <span className="text-[10px] bg-slate-700 text-emerald-400 px-2 py-0.5 rounded font-bold">{aula.dia} - {aula.hora}</span>
                        <h4 className="text-sm font-bold text-slate-100 mt-1">{aula.alunoNome}</h4>
                        <p className="text-xs text-slate-400">{aula.modalidade}</p>
                      </div>
                      <button onClick={() => deletarAula(aula.id)} className="text-slate-500 hover:text-red-400 text-xs p-1">✕</button>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* ALUNOS */}
          {activeTab === 'alunos' && (
            <main className="p-4 space-y-4 max-w-lg mx-auto">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-bold text-slate-100">Gestão de Alunos</h2>
                <button onClick={() => setShowModalAluno(true)} className="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition">
                  + Novo Aluno
                </button>
              </div>

              {alunos.length === 0 ? (
                <p className="text-xs text-slate-500 text-center py-8">Nenhum aluno cadastrado.</p>
              ) : (
                <div className="space-y-3">
                  {alunos.map((aluno) => (
                    <div key={aluno.id} className="p-4 bg-slate-800/60 rounded-xl border border-slate-700/50 space-y-2">
                      <div className="flex items-center justify-between">
                        <h3 className="font-bold text-slate-100">{aluno.nome}</h3>
                        <span className="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-semibold">{aluno.status}</span>
                      </div>
                      <p className="text-xs text-slate-400">{aluno.tipo} • {aluno.plano}</p>
                      <div className="flex items-center justify-between pt-2 border-t border-slate-700/40 text-xs">
                        <span className="font-bold text-emerald-400">{hideValues ? '••••••' : `R$ ${Number(aluno.valor).toFixed(2)}`}</span>
                        <button onClick={() => deletarAluno(aluno.id)} className="text-red-400 hover:underline">Eliminar</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* MODAIS */}
          {/* Modal Lembrete */}
          {showModalLembrete && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-md space-y-4">
                <h3 className="font-bold text-slate-100">Novo Lembrete</h3>
                <form onSubmit={handleAdicionarLembrete} className="space-y-3">
                  <input type="text" required placeholder="Título" value={novoLembrete.titulo} onChange={(e) => setNovoLembrete({ ...novoLembrete, titulo: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm" />
                  <select value={novoLembrete.prioridade} onChange={(e) => setNovoLembrete({ ...novoLembrete, prioridade: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                    <option value="Vermelho">Vermelho (Urgente)</option>
                    <option value="Amarelo">Amarelo (Aviso)</option>
                    <option value="Azul">Azul (Geral)</option>
                  </select>
                  <textarea rows="3" placeholder="Detalhes" value={novoLembrete.texto} onChange={(e) => setNovoLembrete({ ...novoLembrete, texto: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm resize-none"></textarea>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowModalLembrete(false)} className="flex-1 bg-slate-700 p-2 rounded-xl text-sm">Cancelar</button>
                    <button type="submit" className="flex-1 bg-emerald-500 text-slate-950 font-bold p-2 rounded-xl text-sm">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Aluno */}
          {showModalAluno && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-md space-y-4">
                <h3 className="font-bold text-slate-100">Registar Novo Aluno</h3>
                <form onSubmit={handleAdicionarAluno} className="space-y-3">
                  <input type="text" required placeholder="Nome do Aluno" value={novoAluno.nome} onChange={(e) => setNovoAluno({ ...novoAluno, nome: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm" />
                  <select value={novoAluno.tipo} onChange={(e) => setNovoAluno({ ...novoAluno, tipo: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                    <option>Aluno Presencial</option>
                    <option>Créditos de Aulas</option>
                    <option>Consultoria On-line</option>
                  </select>
                  <input type="number" required placeholder="Valor (R$)" value={novoAluno.valor} onChange={(e) => setNovoAluno({ ...novoAluno, valor: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm" />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowModalAluno(false)} className="flex-1 bg-slate-700 p-2 rounded-xl text-sm">Cancelar</button>
                    <button type="submit" className="flex-1 bg-emerald-500 text-slate-950 font-bold p-2 rounded-xl text-sm">Salvar Aluno</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Aula */}
          {showModalAula && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-md space-y-4">
                <h3 className="font-bold text-slate-100">Agendar Aula</h3>
                <form onSubmit={handleAdicionarAula} className="space-y-3">
                  <select value={novaAula.dia} onChange={(e) => setNovaAula({ ...novaAula, dia: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                    <option>Segunda</option><option>Terça</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sábado</option>
                  </select>
                  <input type="time" value={novaAula.hora} onChange={(e) => setNovaAula({ ...novaAula, hora: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm" />
                  <select value={novaAula.alunoId} onChange={(e) => setNovaAula({ ...novaAula, alunoId: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm" required>
                    <option value="">Selecione o Aluno...</option>
                    {alunos.map(a => <option key={a.id} value={a.id}>{a.nome}</option>)}
                  </select>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowModalAula(false)} className="flex-1 bg-slate-700 p-2 rounded-xl text-sm">Cancelar</button>
                    <button type="submit" className="flex-1 bg-emerald-500 text-slate-950 font-bold p-2 rounded-xl text-sm">Agendar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MENU INFERIOR FIXO */}
          <nav className="fixed bottom-0 inset-x-0 bg-slate-800/95 border-t border-slate-700/60 px-6 py-3 flex items-center justify-around z-40 backdrop-blur-md">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-xs">🏠 Início</span>
            </button>
            <button onClick={() => setActiveTab('agenda')} className={`flex flex-col items-center gap-1 ${activeTab === 'agenda' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-xs">📅 Agenda</span>
            </button>
            <button onClick={() => setActiveTab('alunos')} className={`flex flex-col items-center gap-1 ${activeTab === 'alunos' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <span className="text-xs">👥 Alunos</span>
            </button>
          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<ProTrainerFinanceApp />);
  </script>
</body>
</html>
